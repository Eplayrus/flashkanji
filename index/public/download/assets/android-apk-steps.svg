<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Инструкция установки APK Flash Kanji</title>
  <desc id="desc">Три шага: скачать APK, разрешить установку, открыть приложение.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#161722"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1">
      <stop offset="0" stop-color="#ff315f"/>
      <stop offset="1" stop-color="#ff7a3c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" values="1 0 0 0 1 0 0 0 0 .19 0 0 0 0 .37 0 0 0 .65 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <circle cx="798" cy="86" r="88" fill="#ffdf6e" opacity=".16"/>
  <circle cx="834" cy="78" r="80" fill="#08080d" opacity=".72"/>
  <path d="M0 398c124-66 226-54 338-4s230 76 356 16 188-80 266-34v164H0z" fill="#ff315f" opacity=".08"/>
  <g transform="translate(70 72)">
    <rect width="210" height="360" rx="34" fill="#0d0e16" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>
    <rect x="20" y="48" width="170" height="246" rx="22" fill="#171824" stroke="#ff315f" stroke-opacity=".35"/>
    <text x="105" y="126" text-anchor="middle" fill="#ffdf6e" font-family="Georgia,serif" font-size="54" font-weight="700">漢</text>
    <rect x="48" y="180" width="114" height="38" rx="13" fill="url(#hot)" filter="url(#glow)"/>
    <text x="105" y="205" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="800">APK</text>
    <circle cx="105" cy="323" r="11" fill="#ffffff" opacity=".24"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g transform="translate(340 88)">
      <circle cx="34" cy="34" r="34" fill="#ff315f"/>
      <text x="34" y="45" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">1</text>
      <text x="92" y="26" fill="#fff" font-size="28" font-weight="900">Скачайте APK</text>
      <text x="92" y="60" fill="#c8bfca" font-size="20">Файл: flash-kanji-android.apk</text>
    </g>
    <g transform="translate(340 214)">
      <circle cx="34" cy="34" r="34" fill="#ff315f"/>
      <text x="34" y="45" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">2</text>
      <text x="92" y="26" fill="#fff" font-size="28" font-weight="900">Разрешите установку</text>
      <text x="92" y="60" fill="#c8bfca" font-size="20">Android спросит разрешение для браузера</text>
    </g>
    <g transform="translate(340 340)">
      <circle cx="34" cy="34" r="34" fill="#ff315f"/>
      <text x="34" y="45" text-anchor="middle" fill="#fff" font-size="31" font-weight="900">3</text>
      <text x="92" y="26" fill="#fff" font-size="28" font-weight="900">Откройте Flash Kanji</text>
      <text x="92" y="60" fill="#c8bfca" font-size="20">Продолжайте уроки и повторения</text>
    </g>
  </g>
</svg>
