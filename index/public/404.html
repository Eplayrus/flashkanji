<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#08080c" />
  <link rel="canonical" href="https://flashkanji.space/404.html" />
  <title>404 — Flash Kanji</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08080c;
      --panel: rgba(24, 25, 34, .86);
      --line: rgba(255, 255, 255, .15);
      --accent: #f33464;
      --accent-2: #ffdf59;
      --text: #fff;
      --muted: rgba(255, 255, 255, .72);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 78% 18%, rgba(243, 52, 100, .26), transparent 34%),
        radial-gradient(circle at 16% 12%, rgba(255, 223, 89, .12), transparent 28%),
        linear-gradient(135deg, #07080d 0%, #11131b 50%, #08080c 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: clamp(24px, 6vw, 54px);
      background: linear-gradient(145deg, var(--panel), rgba(10, 11, 16, .94));
      box-shadow: 0 32px 90px rgba(0, 0, 0, .42), 0 0 38px rgba(243, 52, 100, .14);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: var(--accent-2);
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 223, 89, .45);
      border-radius: 16px;
      background: rgba(255, 223, 89, .08);
      font-size: 28px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 13vw, 92px);
      line-height: .95;
      text-shadow: 4px 5px 0 var(--accent);
    }

    p {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 3vw, 20px);
      line-height: 1.6;
    }

    code {
      display: inline-block;
      max-width: 100%;
      margin-top: 10px;
      padding: 8px 10px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .06);
      color: #fff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 850;
    }

    a.primary {
      border-color: rgba(243, 52, 100, .8);
      background: linear-gradient(135deg, #ff3f6d, #c91546);
      box-shadow: 0 18px 46px rgba(243, 52, 100, .28);
    }

    a:focus-visible {
      outline: 3px solid rgba(255, 223, 89, .85);
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      main { border-radius: 22px; }
      .actions { display: grid; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <script>
    (function () {
      var legacyIndexShell = /^\/index(?:\/dist)?\/?$/i.test(location.pathname);
      var legacyIndexFile = /^\/index(?:\/dist)?\/index\.html$/i.test(location.pathname);
      if (!legacyIndexShell && !legacyIndexFile) return;
      var target = new URL("/", location.origin);
      target.search = location.search;
      target.hash = location.hash || "#home";
      location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main data-static-not-found>
    <div class="brand"><span class="mark" aria-hidden="true">無</span><span>Flash Kanji</span></div>
    <h1>Страница не найдена</h1>
    <p>Такого URL нет в зарегистрированных маршрутах Flash Kanji. Мы не подменяем битые адреса главной страницей, чтобы не плодить SEO-дубликаты.</p>
    <p>Адрес: <code id="missingPath">/</code></p>
    <div class="actions">
      <a class="primary" href="/">На главную</a>
      <a href="/ru/kanji/">Вики кандзи</a>
      <a href="/download/">Скачать APK</a>
    </div>
  </main>
  <script>
    document.getElementById("missingPath").textContent = location.pathname || "/";
  </script>
</body>
</html>
